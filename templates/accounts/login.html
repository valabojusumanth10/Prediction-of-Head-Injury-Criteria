<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — HIC Predict</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .auth-wrapper { width: 100%; max-width: 480px; padding: 20px; }
        .auth-card {
            background: #fff; border-radius: 24px;
            padding: 44px 40px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.4);
        }
        .brand-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1.6rem; margin: 0 auto 16px;
        }
        .auth-title { font-size: 1.6rem; font-weight: 800; color: #1a1a2e; text-align: center; margin-bottom: 4px; }
        .auth-subtitle { color: #6c757d; text-align: center; font-size: 0.9rem; margin-bottom: 32px; }
        .form-label { font-weight: 600; font-size: 0.85rem; color: #1a1a2e; margin-bottom: 6px; }
        .form-control {
            border-radius: 10px; border: 1.5px solid #e9ecef;
            padding: 12px 16px; font-size: 0.9rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.12);
        }
        .input-group-text {
            border-radius: 10px 0 0 10px; border: 1.5px solid #e9ecef;
            background: #f8f9fa; color: #6c757d;
        }
        .input-group .form-control { border-radius: 0 10px 10px 0; border-left: none; }
        .btn-login {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #e94560, #c73652);
            border: none; border-radius: 10px; color: #fff;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(233,69,96,0.35); }
        .auth-footer { text-align: center; margin-top: 24px; color: #6c757d; font-size: 0.88rem; }
        .auth-footer a { color: #e94560; font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .alert { border-radius: 10px; border: none; font-size: 0.88rem; }
        .mb-3 { margin-bottom: 18px !important; }
    </style>
</head>
<body>
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="brand-icon"><i class="fas fa-car-crash"></i></div>
        <div class="auth-title">Welcome Back</div>
        <div class="auth-subtitle">Sign in to HIC Prediction System</div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn-login mt-2">
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>
        </form>
        <div class="auth-footer">
            Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
